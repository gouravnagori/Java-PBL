# ==============================================================================
# LEGAL DOCUMENT ANALYSER & ADVISOR - APPLICATION CONFIGURATION
# Module: Document Management & Processing (Gourav Nagori)
# ==============================================================================

# Server Port
server.port=8080

# Application Details
spring.application.name=legal-document-analyser

# ==============================================================================
# Multipart File Upload Configurations
# ==============================================================================
# Max file size allowed for legal contracts (PDF, DOCX, TXT, scanned images)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
spring.servlet.multipart.enabled=true

# Storage directory for uploaded documents
app.storage.upload-dir=uploads/documents
app.storage.allowed-types=application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain,image/jpeg,image/png,image/webp

# ==============================================================================
# MongoDB Database Configuration
# ==============================================================================
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/legaladvisor}
spring.data.mongodb.auto-index-creation=true

# ==============================================================================
# Groq AI & Vision OCR Configuration
# Replaces heavyweight native OCR (Tess4J) with ultra-fast Groq Multimodal Vision
# ==============================================================================
groq.api.key=${GROQ_API_KEY:}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.api.model=llama-3.3-70b-versatile
groq.api.vision.model=meta-llama/llama-4-scout-17b-16e-instruct

# ==============================================================================
# Logging Configuration
# ==============================================================================
logging.level.com.legal=INFO
logging.level.org.springframework.data.mongodb=INFO
