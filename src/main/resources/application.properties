# ==============================================================================
# LEGAL DOCUMENT ANALYSER & ADVISOR - UNIFIED APPLICATION CONFIGURATION
# Comprehensive 5th Sem Java PBL Platform
# Team: Gourav Nagori, Ayush Rathore, Dilip Kumawat, Harshvardhan Bhatt, Abhishi Samar
# ==============================================================================

# Server Port (dynamic port for Render deployment)
server.port=${PORT:8080}
spring.application.name=legal-document-analyser

# ==============================================================================
# Multipart File Upload Configurations
# ==============================================================================
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
spring.servlet.multipart.enabled=true

# Storage directory for uploaded documents
app.storage.upload-dir=uploads/documents
app.storage.allowed-types=application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain,image/jpeg,image/png,image/webp

# ==============================================================================
# H2 In-Memory Database (Auth & Case Management Module)
# ==============================================================================
spring.datasource.url=jdbc:h2:mem:legaldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Hibernate & JPA Properties
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ==============================================================================
# MongoDB Database Configuration (Document, Analysis, Reports & Analytics)
# Defaults to localhost:27017 or uses in-memory Mongo server when local is offline
# ==============================================================================
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/legaladvisor}
spring.data.mongodb.auto-index-creation=true

# ==============================================================================
# JWT Token Security Configuration (Ayush Rathore)
# ==============================================================================
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# Support optional local uncommitted override file
spring.config.import=optional:file:./application-local.properties,optional:classpath:application-local.properties

# ==============================================================================
# Groq AI & Vision OCR Configuration (Gourav Nagori)
# ==============================================================================
groq.api.key=${GROQ_API_KEY:}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.api.model=openai/gpt-oss-120b
groq.api.vision.model=qwen/qwen3.8-27b

# ==============================================================================
# Logging Configuration
# ==============================================================================
logging.level.com.legal=INFO
logging.level.org.springframework.data.mongodb=INFO
