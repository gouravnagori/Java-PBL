<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legal Cases | Legal Document Analyser & Advisor</title>
    <link rel="stylesheet" href="/css/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="navbar">
        <a href="/" class="brand">⚖️ Legal <span>Analyser & Advisor</span></a>
        <div class="nav-links" id="nav-auth-slot"></div>
    </header>

    <div class="main-container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <div>
                <h1 style="font-size: 1.8rem; font-weight: 700;">📂 Legal Case Folders</h1>
                <p style="color: #94a3b8; font-size: 0.95rem; margin-top: 0.25rem;">Multi-tenant contract isolation & case organization managed by Ayush's module.</p>
            </div>
            <button onclick="openModal()" class="btn-primary">+ Create New Legal Case</button>
        </div>

        <div id="case-list" class="case-grid">
            <p style="color: #94a3b8;">Loading user cases...</p>
        </div>
    </div>

    <!-- Modal Dialog -->
    <div id="case-modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); align-items: center; justify-content: center; z-index: 1000;">
        <div class="auth-card" style="margin: 0; width: 90%; max-width: 520px;">
            <h2 style="margin-bottom: 1.25rem;">Create Legal Case Folder</h2>
            <form id="new-case-form">
                <div class="form-group">
                    <label>Case Title</label>
                    <input type="text" id="case-title" required placeholder="e.g. Master Services Agreement Audit">
                </div>
                <div class="form-group">
                    <label>Client / Entity Name</label>
                    <input type="text" id="case-client" required placeholder="Acme International LLC">
                </div>
                <div class="form-group">
                    <label>Case Category</label>
                    <select id="case-category">
                        <option value="GENERAL_CONTRACT">General Contract</option>
                        <option value="CONTRACT_DISPUTE">Contract Dispute</option>
                        <option value="EMPLOYMENT_AGREEMENT">Employment Agreement</option>
                        <option value="REAL_ESTATE_LEASE">Real Estate Lease</option>
                        <option value="NDA_COMPLIANCE">NDA & Confidentiality</option>
                        <option value="IP_LICENSING">IP Licensing & Patents</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Description & Scope</label>
                    <textarea id="case-desc" rows="3" placeholder="Case background notes and contract liabilities..."></textarea>
                </div>
                <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                    <button type="button" onclick="closeModal()" class="btn-primary" style="flex: 1; background: #334155;">Cancel</button>
                    <button type="submit" class="btn-primary" style="flex: 1;">Create Case</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/cases.js"></script>
</body>
</html>
