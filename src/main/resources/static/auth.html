<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication | Legal Document Analyser & Advisor</title>
    <link rel="stylesheet" href="/css/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="navbar">
        <a href="/" class="brand">⚖️ Legal <span>Analyser & Advisor</span></a>
        <div class="nav-links" id="nav-auth-slot">
            <a href="/">Home</a>
            <a href="/cases.html">Cases</a>
        </div>
    </header>

    <div class="main-container">
        <div class="auth-card">
            <div class="tabs">
                <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Sign In</button>
                <button class="tab-btn" id="tab-register" onclick="switchTab('register')">Register</button>
            </div>

            <div id="alert-box" class="alert-box"></div>

            <!-- Login Form -->
            <form id="login-form">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="login-email" required placeholder="attorney@legalpbl.org">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="login-password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 1rem;">Authenticate with JWT</button>
            </form>

            <!-- Register Form -->
            <form id="register-form" style="display: none;">
                <div class="form-group">
                    <label>Full Legal Name</label>
                    <input type="text" id="reg-name" required placeholder="Ayush Rathore">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="reg-email" required placeholder="ayush@legalpbl.org">
                </div>
                <div class="form-group">
                    <label>Password (min. 6 characters)</label>
                    <input type="password" id="reg-password" minlength="6" required placeholder="••••••••">
                </div>
                <div class="form-group">
                    <label>Module / Role</label>
                    <select id="reg-role">
                        <option value="ROLE_USER">Client / Legal User</option>
                        <option value="ROLE_LEGAL_ANALYST">Legal Analyst</option>
                    </select>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 1rem;">Create Account</button>
            </form>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script>
        function switchTab(tab) {
            const loginTab = document.getElementById('tab-login');
            const regTab = document.getElementById('tab-register');
            const loginForm = document.getElementById('login-form');
            const regForm = document.getElementById('register-form');
            const alertBox = document.getElementById('alert-box');
            alertBox.style.display = 'none';

            if (tab === 'login') {
                loginTab.classList.add('active');
                regTab.classList.remove('active');
                loginForm.style.display = 'block';
                regForm.style.display = 'none';
            } else {
                regTab.classList.add('active');
                loginTab.classList.remove('active');
                regForm.style.display = 'block';
                loginForm.style.display = 'none';
            }
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const alertBox = document.getElementById('alert-box');

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const json = await res.json();
                if (res.ok) {
                    saveToken(json.data.token);
                    localStorage.setItem('auth_user_name', json.data.name);
                    localStorage.setItem('auth_user_email', json.data.email);
                    window.location.href = '/cases.html';
                } else {
                    alertBox.className = 'alert-box error';
                    alertBox.innerText = json.message || 'Invalid credentials';
                }
            } catch (err) {
                alertBox.className = 'alert-box error';
                alertBox.innerText = 'Network error connecting to backend.';
            }
        });

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const role = document.getElementById('reg-role').value;
            const alertBox = document.getElementById('alert-box');

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password, role })
                });
                const json = await res.json();
                if (res.ok) {
                    saveToken(json.data.token);
                    window.location.href = '/cases.html';
                } else {
                    alertBox.className = 'alert-box error';
                    alertBox.innerText = json.message || 'Registration failed.';
                }
            } catch (err) {
                alertBox.className = 'alert-box error';
                alertBox.innerText = 'Network error connecting to backend.';
            }
        });
    </script>
</body>
</html>
